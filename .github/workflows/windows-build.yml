name: Windows Build

# Compiles the Noggit editor on a Windows runner (MSVC + Qt 5.15).
# Produces a deployable noggit.exe (windeployqt runs as a POST_BUILD step).

on:
  workflow_dispatch:
    inputs:
      unity_build:
        description: "Jumbo/unity build for the noggit target (faster, riskier)"
        type: boolean
        default: false
  push:
    branches:
      - arena/dd4f44ab-shadowworld-noggit-modern
  pull_request:
    branches:
      - shadowworld-modern-test

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Release, x64)
    runs-on: windows-2022
    timeout-minutes: 350

    env:
      BUILD_DIR: build
      QT_VERSION: "5.15.2"

    steps:
      - name: Checkout (without submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # The GitHub-hosted dependencies are mandatory for a configure.
      - name: Fetch required submodules
        shell: bash
        run: |
          git submodule update --init --depth 1 \
            cmake \
            src/external/blizzard-archive-library \
            src/external/blizzard-database-library \
            dist/definitions

      # dist/listfile and dist/themes live on gitlab.com; only needed for the
      # POST_BUILD copy steps, so a failure here must not kill the build.
      - name: Fetch optional distribution submodules
        shell: bash
        continue-on-error: true
        run: |
          git submodule update --init --depth 1 dist/listfile dist/themes
          mkdir -p dist/themes dist/listfile

      - name: Ensure distribution folders exist
        shell: bash
        run: mkdir -p dist/themes dist/listfile

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.31.6"
          ninjaVersion: "1.12.1"

      - name: Install Qt ${{ env.QT_VERSION }} (MSVC 2019 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      # The CI job builds through build.cmd itself, so the local one-command
      # build script is exercised on every run instead of bit-rotting.
      - name: Configure and build (build.cmd)
        shell: cmd
        env:
          CMAKE_EXTRA_ARGS: ${{ inputs.unity_build && '-DFAST_BUILD_NOGGIT_JUMBO=ON' || '' }}
        run: |
          call build.cmd release > build.log 2>&1
          set "RC=%ERRORLEVEL%"
          type build.log
          exit /b %RC%

      - name: Collect build output
        if: always()
        shell: bash
        run: |
          echo "--- bin ---"
          ls -la "$BUILD_DIR/bin" 2>/dev/null || true
          find "$BUILD_DIR" -name "*.exe" -maxdepth 3 2>/dev/null || true

      - name: Verify build output
        if: success()
        shell: bash
        run: |
          EXE="$BUILD_DIR/bin/noggit.exe"
          if [ ! -f "$EXE" ]; then
            echo "::error title=Missing binary::noggit.exe was not produced in $BUILD_DIR/bin"
            exit 1
          fi
          size=$(stat -c%s "$EXE")
          magic=$(head -c 2 "$EXE")
          dlls=$(ls "$BUILD_DIR/bin" | grep -c '\.dll$' || true)
          echo "noggit.exe: ${size} bytes, PE magic '${magic}', ${dlls} deployed DLLs"

          set +e
          QT_QPA_PLATFORM=offscreen timeout 25 "./$EXE" > /dev/null 2>&1
          smoke=$?
          set -e
          echo "headless start-up probe exit code: ${smoke} (124 = still running when killed, expected for a GUI app)"

          {
            echo "### Windows build succeeded"
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| noggit.exe | ${size} bytes |"
            echo "| PE magic | ${magic} |"
            echo "| deployed Qt/runtime DLLs | ${dlls} |"
            echo "| headless start-up probe | exit ${smoke} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=noggit.exe built::${size} bytes, ${dlls} DLLs deployed, start-up probe exit ${smoke}"

      # Artifact/log downloads are not reachable from every environment, so the
      # tail of the failing log is re-published as a check-run annotation (that
      # is readable through the REST API).
      - name: Publish failure details
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import glob, os, urllib.parse
          for name in ("configure.log", "build.log"):
              if not os.path.exists(name):
                  continue
              lines = open(name, errors="replace").read().splitlines()
              if not lines:
                  continue
              errs = [i for i, l in enumerate(lines) if "CMake Error" in l or "error:" in l or "FAILED:" in l]
              chunks = []
              if errs:
                  start = max(0, errs[0] - 5)
                  chunks = lines[start:start + 45]
              else:
                  chunks = lines[-45:]
              text = "\n".join(x[:300] for x in chunks)
              escaped = urllib.parse.quote(text, safe="")
              print(f"::error title={name} (tail)::{escaped}")
          PY

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: noggit-windows-x64
          path: build/bin/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload configure/build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeConfigureLog.yaml
            ${{ env.BUILD_DIR }}/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 7

  # Manual-only job: proves build.cmd works from a plain cmd prompt, i.e. with
  # no pre-set MSVC environment, so the vswhere/vcvars64 path is exercised.
  clean-shell:
    name: build.cmd from a plain shell
    # Runs on manual dispatch, or on any commit whose message contains
    # [clean-shell], so the path can be verified without doubling every push.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[clean-shell]')
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Checkout (without submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Fetch required submodules
        shell: bash
        run: |
          git submodule update --init --depth 1 \
            cmake \
            src/external/blizzard-archive-library \
            src/external/blizzard-database-library \
            dist/definitions
          mkdir -p dist/themes dist/listfile

      - name: Set up CMake and Ninja only
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.31.6"
          ninjaVersion: "1.12.1"

      - name: Install Qt ${{ env.QT_VERSION }} (MSVC 2019 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      # No ilammy/msvc-dev-cmd here on purpose: build.cmd has to find and
      # initialise MSVC by itself.
      - name: Run build.cmd
        shell: cmd
        run: |
          call build.cmd release > clean-build.log 2>&1
          set "RC=%ERRORLEVEL%"
          type clean-build.log
          exit /b %RC%

      - name: Report failure details
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import os, urllib.parse
          name = "clean-build.log"
          if os.path.exists(name):
              text = "\n".join(open(name, errors="replace").read().splitlines()[-45:])
              print(f"::error title={name} (tail)::{urllib.parse.quote(text, safe='')}")
          PY

      - name: Collect build output
        if: always()
        shell: bash
        run: |
          ls -la build/bin 2>/dev/null || true

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: noggit-windows-x64-clean-shell
          path: build/bin/
          if-no-files-found: warn
          retention-days: 14
